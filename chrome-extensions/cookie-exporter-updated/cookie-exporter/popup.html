<!DOCTYPE html>
<html>
<head>
  <title>Cookie Exporter</title>
  <style>
    body { font-family: sans-serif; margin: 10px; width: 420px; }
    textarea { width: 100%; height: 90px; font-family: monospace; font-size: 12px; }
    button { margin-top: 8px; width: 100%; padding: 7px; }
    #status { margin-top: 10px; color: green; font-weight: bold; }
    .hint { font-size: 12px; color: #555; margin: 6px 0 10px; }
    h4 { margin-top: 16px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h3>Cookie Exporter</h3>
  <div class="hint">For Postman, use the filtered auth cookies first.</div>

  <h4>Filtered auth cookies (.AspNet.Cookies + NSC*)</h4>
  <textarea id="authCookieOutput" readonly></textarea>
  <button id="copyAuthButton">Copy Filtered Auth Cookies</button>

  <h4>All cookies from active tab domain</h4>
  <textarea id="domainCookieOutput" readonly></textarea>
  <button id="copyDomainButton">Copy All Domain Cookies</button>

  <h4>Latest Cookie header captured from a real request</h4>
  <textarea id="sentCookieOutput" readonly></textarea>

  <button id="refreshButton">🔄 Refresh & Capture Current Page</button>
  <button id="downloadButton">Download Filtered Auth Cookies as .txt</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
